<style>
    .column_image {
        float: left;
        width: 200px;
    }

    .column {
        float: left;
        width: 15.33%;
    }

    .column_no_float {
        width: 15.33%;
        float: left;
    }

    .opc_below, .opc_below_no_space{
        clear: both;
    }

    .opc_below{
        padding-top: 45px;
    }

    .field_title{
        color: #505050;
    }
    h1{
        padding-bottom: 15px;
    }

    .opc_row {
        padding-bottom: 15px;
        padding-left: 50px;
        width: 700px;
        float:left;
    }

    .opc_row_series {
        padding-bottom: 15px;
        padding-left: 50px;
        width: 700px;
        float:left;
        display: block;
    }

    .image_preview {
        width:220px;
        height:123px;
        float:left;
    }
    @media only screen and (max-width: 1235px) {
        .opc_row_series {
            display:none;
        }
    }
    @media only screen and (max-width: 1235px) {

        .column_no_float {
            float: none;
        }
    }

</style>
<!-- BEGIN found_details -->
<h1>{CURRENT_TITLE}</h1>
<div id="opc_container">
    <div class="column_image">
        <!-- BEGIN image_preview -->
        <img class="image_preview" src="{OPC_PREVIEW}">
        <!-- END image_preview -->
    </div>
    <div class="column">
        <h4 class="opc_row"><b>{VIDEO_TITLE}</b></h4>
        <div class="opc_row"><span class="field_title">{DATE_TXT} </span>{DATE}<b>&emsp;&emsp;</b><span class="field_title">{SERIE_TXT} </span>{SERIE}<br></div>
        <div class="opc_row"><span class="field_title">{PRESENTER_TXT} </span>{PRESENTER}</div>
    </div>
    <div class="column_no_float">
        <h4 class="opc_row_series"><b>&emsp;</b></h4>
        <div class="opc_row"></div>
    </div>
</div>
<h1 class="opc_below">{TITLE_FOUND_DETAILS}</h1>
<!-- END found_details -->

<!-- BEGIN no_text -->
<h1 class="opc_below_no_space">{TITLE_NO_DETAILS}</h1>
<!-- END no_text -->
